[package]
name = "runner"
version = "0.1.0"
edition = "2024"
description = "The wasmtime host: the two ll-store imports, the mount table, and the run loop"

[dependencies]
wasmtime = "48.0.1"
# For `SIGINT`. The runner has to notice Ctrl-C to turn it into the
# container's own `SIGTERM`, and a signal handler is the only way a process
# is told about one.
libc = "0.2"

[dev-dependencies]
anyhow = "1.0.104"
