<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>zaqaru — a container, in time</title>
<style>
  :root { color-scheme: light dark; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; --accent: #58a6ff; --line: #8884; --dim: #8886; }
  body { margin: 0; display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
  header { padding: 6px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header input[type=file] { max-width: 200px; }
  header input[type=text], header input[type=number] { font: inherit; }
  #controls { display: contents; }
  #controls.hidden { display: none; }
  #status { opacity: .8; }
  #timeline { padding: 6px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  #slider { flex: 1; }
  #at { min-width: 16em; text-align: right; }
  #pinned { opacity: .8; }
  #pinned:empty { display: none; }
  main { display: grid; grid-template-columns: minmax(24em, 1fr) 3fr; gap: 1px; background: var(--line); min-height: 0; }
  #events-panel { background: Canvas; padding: 6px 10px; overflow: auto; min-height: 0; display: flex; flex-direction: column; }
  #events-panel h2 { display: flex; gap: 8px; align-items: center; }
  #events { overflow: auto; flex: 1; }
  #store { background: Canvas; overflow: auto; min-height: 0; padding: 6px 10px; }
  h2 { margin: 0 0 4px; font-size: 11px; font-weight: 600; opacity: .7; text-transform: uppercase; letter-spacing: .04em; position: sticky; top: 0; background: Canvas; z-index: 1; }
  h2 .path { text-transform: none; letter-spacing: 0; font-weight: 600; }
  h2 .tools { float: right; font-weight: normal; }
  h2 .tools button { font: inherit; font-size: 11px; padding: 0 4px; opacity: .8; }
  h2 .tools button.on { background: var(--accent); color: white; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-all; }
  #pathbar { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  #pathbar input { flex: 1; font: inherit; }
  #pathbar button { font: inherit; }
  #answer { max-height: 12em; overflow: auto; border: 1px solid var(--line); padding: 4px 6px; margin-bottom: 8px; }
  #answer:empty { display: none; }
  #panels, #machine .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(26em, 1fr)); gap: 8px; }
  .panel { border: 1px solid var(--line); padding: 4px 8px; max-height: 26em; overflow: auto; min-width: 0; }
  .panel .raw { display: none; }
  .panel.raw .body { display: none; }
  .panel.raw .raw { display: block; }
  .panel .diff { border-top: 1px dashed var(--line); margin-top: 4px; padding-top: 4px; }
  .panel .diff:empty { display: none; }
  .diff .add { color: #3fb950; }
  .diff .remove { color: #f85149; }
  .diff .change { color: #d29922; }
  .diff .none { opacity: .6; font-style: italic; }
  #machine { margin-top: 10px; }
  #machine summary { cursor: pointer; opacity: .8; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; margin-bottom: 6px; }
  .event { cursor: pointer; white-space: pre; opacity: .45; padding: 0 4px; }
  .event.past { opacity: 1; }
  .event.now { background: #58a6ff33; }
  .event:hover { background: var(--line); }
  .event.exchange { color: #a5d6ff; }
  .event.exchange .op { opacity: .7; }
  .event.error { color: #f85149; }
  .elided { opacity: .5; padding: 2px 4px; font-style: italic; }
  .process { margin-bottom: 6px; padding: 3px 6px; border-left: 3px solid #8888; cursor: pointer; }
  .process.current { border-left-color: var(--accent); }
  .process.viewing { background: #58a6ff18; }
  .thread { padding-left: 12px; opacity: .8; }
  .thread.viewing { opacity: 1; text-decoration: underline; }
  .kv { padding-left: 1em; }
  .kv > div { display: flex; gap: 8px; }
  .kv .key { opacity: .7; min-width: 6em; }
  .kv .key::after { content: ":"; }
  .registers div { display: flex; gap: 8px; }
  .registers .name { width: 64px; opacity: .7; }
  .stale { color: #d29922; }
  .line { display: grid; grid-template-columns: 9em 16em 1fr; gap: 8px; white-space: pre; }
  .line.rip { background: #58a6ff33; }
  .line .bytes { opacity: .6; }
  .word { white-space: pre; }
  .word .address { opacity: .6; }
  table { border-collapse: collapse; }
  td, th { padding: 0 8px 0 0; text-align: left; vertical-align: top; white-space: nowrap; }
  th { opacity: .7; font-weight: normal; }
  a.link, .crumb a { color: var(--accent); cursor: pointer; text-decoration: none; }
  a.link:hover, .crumb a:hover { text-decoration: underline; }
  .crumb { margin-bottom: 4px; }
  .crumb .sep { opacity: .5; }
  .entry.directory a { font-weight: 600; }
  .filehead { opacity: .7; margin-bottom: 4px; }
  .socket { margin-bottom: 4px; }
  .socket .id { opacity: .7; }
  .edge form { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .edge input[type=text] { flex: 1; min-width: 12em; font: inherit; }
  .exchange-box { border-top: 1px solid var(--line); padding: 4px 0; }
  .exchange-box .meta { opacity: .7; }
  .exchange-box a { color: var(--accent); cursor: pointer; }
  .exchange-box pre { max-height: 14em; overflow: auto; }
  .refusal { opacity: .7; font-style: italic; }
  button, select { font: inherit; }
</style>
</head>
<body>
<header>
  <strong>zaqaru</strong>
  <span id="controls">
    <label>module <input id="module" type="file" accept=".wasm"></label>
    <label>tape <input id="tape" type="file"></label>
    <label>snapshot <input id="snapshot" type="file"></label>
    <label>live ports <input id="publish" type="text" value="8080" style="width:6em"></label>
    <label>checkpoint every <input id="every" type="number" value="2000000" step="1000000" style="width:9em"></label>
    <button id="load">load</button>
  </span>
  <span id="status">choose a module and a tape to replay, a module alone to run live, or a module and a snapshot to continue a booted one; or pass ?module=…&amp;tape=…, ?module=…&amp;live=8080, ?module=…&amp;snapshot=…&amp;live=80</span>
</header>
<div id="timeline">
  <button id="prev" title="previous event">⇤</button>
  <button id="back" title="one instruction back">−1</button>
  <button id="play">play</button>
  <button id="forward" title="one instruction forward">+1</button>
  <button id="next" title="next event">⇥</button>
  <input id="slider" type="range" min="0" max="0" value="0">
  <span id="at">0</span>
  <span id="took" style="opacity:.6;min-width:12em"></span>
  <label>step <select id="speed"><option value="10000">10k</option><option value="100000" selected>100k</option><option value="1000000">1M</option><option value="10000000">10M</option></select></label>
  <button id="pin" title="pin this instant: every panel then shows what changed since">pin</button>
  <span id="pinned"></span>
</div>
<main>
  <section id="events-panel">
    <h2>timeline
      <select id="filter" title="the idle polls that found nothing are left out, and repeats of one exchange within a syscall are folded, unless 'everything' is chosen"><option value="all">syscalls and exchanges</option><option value="syscall">syscalls</option><option value="exchange">exchanges with the host</option><option value="raw">everything, unfolded</option></select>
    </h2>
    <div id="events"></div>
  </section>
  <div id="store">
    <form id="pathbar">
      <label for="path">read</label>
      <input id="path" type="text" list="paths" placeholder="a path of the container's store, at this instant — processes, net, processes/1/files/etc, …" autocomplete="off">
      <datalist id="paths"></datalist>
      <button id="go" type="submit">read</button>
    </form>
    <pre id="answer"></pre>
    <div id="panels"></div>
    <details id="machine">
      <summary>the machine</summary>
      <div class="grid"></div>
    </details>
  </div>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
