[package]
name = "zaqaru-x87"
version = "0.1.0"
edition = "2024"
description = "Soft emulation of the x87 FPU: extended-precision softfloat and the register stack"

[lib]
name = "x87"

[dependencies]
# The pure-Rust musl math routines, for the f64-backed transcendental
# operations. wasm32-unknown-unknown has no libm to link, so the algorithms
# come along as Rust rather than as undefined symbols.
libm = "0.2"
