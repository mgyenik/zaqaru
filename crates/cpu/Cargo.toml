[package]
name = "zaqaru-cpu"
version = "0.1.0"
edition = "2024"
description = "The x86-64 machine: an interpreter, and the bytecode it transpiles hot blocks into"

[lib]
name = "cpu"

[features]
# Counting what a real program retires, so that the next instruction to
# lower is chosen by measurement rather than by reading code and guessing.
# Off by default because it runs once per retired instruction, which is the
# one place this engine cannot afford anything.
histogram = []
# The same bargain for addresses: which guest code a run spends itself in,
# counted exactly, at the cost of running several times slower while it is
# being counted.
profile = []

[dependencies]
# Decoding and the RFLAGS-effect tables, and nothing else: no encoder, no
# formatters. The engine names an instruction it cannot execute by its
# mnemonic and its bytes, which needs neither, and every feature left out is
# module bytes a browser does not download. `instr_info` earns its place
# twice — it is what the lockstep oracle masks undefined flag bits with.
iced-x86 = { version = "1.21.0", default-features = false, features = [
    "std",
    "decoder",
    "instr_info",
] }
x87 = { package = "zaqaru-x87", path = "../x87" }

# Only the native build needs this, and only to make linear memory exist:
# inside the module the address space is the module's own memory and there is
# nothing to map. See `arena`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2"

[dev-dependencies]
# The assembler, for building guest programs inside a test rather than
# checking in bytes nobody can read.
iced-x86 = { version = "1.21.0", features = ["code_asm"] }
# The lockstep oracle reads the corpus binary's symbol table to find the
# probes, the stack and the stop address.
object = "0.40.0"
# `ptrace`, `fork` and the register block. A dependency of the library on
# native targets already, but an integration test links against the crate's
# public interface rather than its dependencies, so it says so itself — as
# does the x87 crate, whose save image the oracle rotates onto the layout
# `ptrace` reports.
libc = "0.2"
x87 = { package = "zaqaru-x87", path = "../x87" }
