[package]
name = "zaqaru-kernel"
version = "0.1.0"
edition = "2024"
description = "The in-guest Linux-personality kernel: syscalls handled inside the wasm module"

[lib]
name = "kernel"

[dependencies]
# The address space. `cpu/src/space.rs` is the page table — one bit per page
# per permission, plus the bitmap that says which pages a decoded block came
# from — and `kernel/src/space.rs` is the VMA tree above it: what a mapping
# *is*, what it is called, and what `/proc/self/maps` says about it. Real
# kernels keep both for the same reason. The tree answers questions; the
# table is what every access tests, so it has to be a load and a shift.
cpu = { package = "zaqaru-cpu", path = "../cpu" }
# Decompressing the image's files on first open. The pure-Rust decoder
# rather than the C one, because this runs inside the module; without its
# default features, because the checksum it would verify is replaced by a
# length the index already knows, and the hasher is a dependency the
# module does not need.
ruzstd = { version = "0.9", default-features = false }

[dev-dependencies]
# A cycle Cargo allows, and the honest one: the kernel's tests drive real
# baked images rather than a hand-written stand-in for one.
image = { package = "zaqaru-image", path = "../image" }
# The `interpret` example serves a container to the host, which means real
# sockets — and the one place they live is the host's `/iso/net` broker.
# Sharing it rather than writing a second is the point: the edge the native
# driver serves and the edge the module serves have to be the same protocol,
# or the native runs stop being evidence about the module.
host = { package = "zaqaru-host", path = "../host" }
libc = "0.2"
