[workspace]
members = [
    "crates/bake",
    "crates/cli",
    "crates/cpu",
    "crates/guest",
    "crates/host",
    "crates/image",
    "crates/kernel",
    "crates/x87",
]
resolver = "3"

# Dependencies are built optimized even for tests.
#
# Not a preference: the suite's cost is dominated by three of them running
# unoptimized. `iced-x86` decodes every instruction the interpreter
# executes, `wasmtime` compiles every body of every container a test builds,
# and `zstd` compresses every file of every image. The same work takes
# seconds through the release binaries and an order of magnitude more in a
# debug test — multiplied by every run of every test for as long as the
# project exists.
#
# Debug *info* is kept, and `debug-assertions` is untouched: it is set
# independently of `opt-level`, so every `debug_assert!` and overflow check
# inside a dependency still fires. What optimization costs is frames merged
# by inlining, and the diagnostics this project actually reads — a wasm
# backtrace out of a trapping guest — come from the guest module's own name
# section rather than from any of this. If a failure ever genuinely needs an
# unoptimized dependency, that is one `CARGO_PROFILE_DEV_PACKAGE_<crate>_OPT_LEVEL=0`
# on one test, not a tax on every run.
[profile.dev.package."*"]
opt-level = 2

# And the interpreter, which is not a dependency but is the same kind of
# cost. Every test that runs a real program retires tens of millions of
# instructions through `cpu::exec`, and an unoptimised dispatch loop is
# an order of magnitude of that — the difference between a suite that runs
# after every edit and one nobody runs. `debug-assertions` is untouched, so
# every `debug_assert!` in the engine still fires.
[profile.dev.package.zaqaru-cpu]
opt-level = 3
