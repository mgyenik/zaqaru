# One worker on purpose: nginx's master passes worker channel sockets to
# other workers with `SCM_RIGHTS`, which `docs/network-plan.md` §9 names as
# a pothole and defers to N5. With one worker nothing is passed.
worker_processes 1;
error_log /dev/stderr info;
pid /run/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log /dev/stdout;
    server {
        listen 80;
        server_name _;
        location / {
            # Loopback, which under the interpreter never leaves the arena.
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }
    }
}
